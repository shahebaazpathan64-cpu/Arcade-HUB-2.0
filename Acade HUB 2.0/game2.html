<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050507">

    <title>Mystery Parda - Space HUD</title>


    <!-- FONTS -->

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/game2.css">

</head>


<body>


    <!-- =====================================================
         BACKGROUND
    ===================================================== -->

    <div id="bg"></div>

    <div class="hud-grid"></div>


    <!-- =====================================================
         HEADER
    ===================================================== -->

    <div class="header">

        <h1>

            SYSTEM_ACCESS:
            MYSTERY_PARDA

        </h1>


        <div class="header-stats">


            <div class="stat-box">

                QUIZ:

                <span id="quiz-val">
                    0
                </span>

                /3

            </div>


            <div class="stat-box">

                CYCLE_TIME:

                <span id="timer-val">
                    00
                </span>

                s

            </div>


        </div>

    </div>


    <!-- =====================================================
         CLUE DISPLAY
    ===================================================== -->

    <div id="clue-container">

        <div class="clue-tag">
            TARGET_TELEMETRY_SIGNATURE
        </div>


        <div id="clue-text">
            AWAITING CORE INITIALIZATION...
        </div>

    </div>


    <!-- =====================================================
         MYSTERY BOX
    ===================================================== -->

    <div
        class="mystery-box"
        id="main-box"
    >


        <div
            id="parda-left"
            class="curtain"
        >
        </div>


        <div
            id="parda-right"
            class="curtain"
        >
        </div>


        <div id="revealed-item-display">
            ?
        </div>


    </div>


    <!-- =====================================================
         STATUS
    ===================================================== -->

    <p id="status-text">
        SYSTEM STANDBY
    </p>


    <!-- =====================================================
         ITEM GRID
    ===================================================== -->

    <div
        id="items-grid"
        class="grid"
    >
    </div>


    <!-- =====================================================
         CENTER MESSAGE
    ===================================================== -->

    <div id="msg-overlay">
        READY
    </div>


    <!-- =====================================================
         POPUP
    ===================================================== -->

    <div id="popupOverlay">

        <div
            class="popup-box"
            id="popupBox"
        >
        </div>

    </div>
    <script src="assets/page-transition.js"></script>
    <script src="assets/sounds.js"></script>
    <script src="assets/game2.js"></script>


</body>

</html>
