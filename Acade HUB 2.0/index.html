<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#020b0f">

    <title>ARCADE HUB</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/index.css">

</head>


<body>


    <!-- =====================================
     CUSTOM CURSOR
===================================== -->

    <div class="cursor" id="cursor"></div>


    <!-- =====================================
     VIDEO BACKGROUND
===================================== -->

    <div id="page-fade"></div>

    <video autoplay muted loop playsinline id="background-video">

        <source src="videos/video1.mp4" type="video/mp4">

    </video>


    <!-- DARK OVERLAY -->

    <div class="overlay"></div>


    <!-- =====================================
     LOGIN SCREEN
===================================== -->

    <div class="container" id="loginScreen">


        <div class="access-text">

            ACCESSING HUB...

        </div>


        <h1 class="title">

            ARCADE HUB

        </h1>


        <div class="subtitle">

            ULTRA EDITION 2026

        </div>


        <div class="login-box">


            <!-- USERNAME -->

            <div class="input-group">

                <input type="text" id="username" placeholder="USER NAME">

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <input type="password" id="password" placeholder="PASSWORD">

                <button class="eye-btn" id="eyeBtn" onclick="togglePassword()">
                    <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24"
                        fill="none" stroke="#00d9ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </button>

            </div>


            <!-- LOGIN BUTTON -->

            <button id="loginBtn" onclick="login()">

                LOGIN

            </button>


            <div id="message"></div>


        </div>


    </div>


    <!-- =====================================
     WELCOME SCREEN
===================================== -->

    <div id="gameScreen">


        <h1 class="game-title">

            ARCADE HUB

        </h1>


        <div class="welcome-text" id="welcomeText">

            WELCOME PLAYER

        </div>


    </div>


    <!-- =====================================
     JAVASCRIPT
===================================== -->

    <script src="assets/index.js"></script>


</body>

</html>
