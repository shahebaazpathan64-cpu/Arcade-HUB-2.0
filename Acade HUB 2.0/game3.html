<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#050507">

    <title>ARCADE HUB - Space Reaction</title>


    <!-- FONTS -->

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/game3.css">

</head>


<body>


    <!-- BACKGROUND -->

    <div id="bg"></div>

    <div class="hud-grid"></div>


    <!-- SYSTEM ACCESS -->

    <div class="btn-system">

        SYSTEM_ACCESS

    </div>


    <!-- TOP HUD -->

    <div id="ui">

        <div class="stat-bar">

            <div class="stat-item">

                SCORE_

                <span id="score">

                    0

                </span>

                /

                <span id="target">

                    10

                </span>

            </div>


            <div class="stat-item">

                TIME_

                <span id="timer">

                    00:20

                </span>

            </div>


            <div class="stat-item">

                STAGE_

                <span id="stage">

                    1

                </span>

            </div>


            <div class="stat-item">

                <span id="freeze-status">

                </span>

            </div>

        </div>

    </div>


    <!-- GAME HEADING -->

    <div class="game-heading">

        <h1>

            SPACE REACTION

        </h1>

        <p>

            CLICK GREEN TARGETS • AVOID RED TARGETS

        </p>

    </div>


    <!-- CENTER MESSAGE -->

    <div id="msg-overlay">

        READY

    </div>


    <!-- GAME AREA -->

    <div id="game-container">

        <div id="playArea">

        </div>

    </div>


    <!-- POPUP SYSTEM -->

    <div id="popupOverlay">

        <div class="popup-box" id="popupBox">

        </div>

    </div>
    <script src="assets/page-transition.js"></script>
    <script src="assets/sounds.js"></script>
    <script src="assets/game3.js"></script>


</body>

</html>
